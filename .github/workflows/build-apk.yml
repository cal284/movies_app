# .github/workflows/build-apk.yml
# Builds a debug APK every time you push to main (or when you click "Run workflow").

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:            # adds a manual "Run workflow" button on the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04       # pinned so the Ubuntu 26 switch doesn't surprise you

    steps:
      # 1. Copy your repo's code onto the build machine
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Install Java (Android builds need JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle and cache downloads so later builds are faster
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'   # only used if your repo has no gradlew file

      # 4. Show what's in the repo (helps when a path is wrong)
      - name: List project files
        run: ls -la

      # 5. Build the APK.
      #    If your repo has the Gradle wrapper (gradlew), use it and make it executable.
      #    Files committed from Windows lose their "executable" flag, which causes
      #    "Permission denied". chmod +x fixes that.
      #    If there is no wrapper, fall back to the Gradle installed in step 3.
      - name: Build debug APK
        env:
          # Passes the GitHub secret into the build as an environment variable.
          # Gradle reads it and bakes it into the app (BuildConfig).
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No gradlew found, using installed Gradle"
            gradle assembleDebug --stacktrace
          fi

      # 6. Save the APK so you can download it from the run's Summary page
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: databounty-movies-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
